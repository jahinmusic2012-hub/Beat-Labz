
workflows:
  beat-labz-android:
    name: BEAT LABZ Android APK

    max_build_duration: 60

    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Prepare Gradle
        script: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build Android APK
        script: |
          ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/*.apk

