
workflows:
  beat-labz-android:
    name: BEAT LABZ Android APK

    max_build_duration: 60

    instance_type: linux_x2

    environment:
      java: 17

    scripts:
      - name: Check Gradle
        script: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build BEAT LABZ APK
        script: |
          ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/*.apk
